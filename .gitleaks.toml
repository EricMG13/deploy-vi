# gitleaks' default rules. Path exemptions are added only where a file holds
# content digests and nothing that could be a credential.
[extend]
useDefault = true

# design/mockups/shared/data.js is generated sample data; its `"key": "adj_ebitda_h1_2026"`
# JSON field names trip generic-api-key (132 false positives, none a credential).
[[allowlists]]
description = "mockup sample-data field names"
paths = ['''design/mockups/shared/data\.js''']
